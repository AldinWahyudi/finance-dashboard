[project]
name = "finance-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for personal finance dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI's standard pattern is `Depends(...)` in defaults.
# UP006/UP007: allow legacy typing.Optional/List syntax in pydantic schemas
# to work around forward-ref resolution issues with `date: date | None` style.
ignore = ["E501", "B008", "UP006", "UP007", "UP035"]
